 let md=99;if(active())md=Math.hypot(x-me.x,y-me.y);for(const e of E)if(e.alive)md=Math.min(md,Math.hypot(x-e.x,y-e.y));if(md>bd){bd=md;best=[x,y]}}return best}
function spawnMe(){const p=randSpawn();me.x=p[0];me.y=p[1];me.hp=100;me.alive=true;me.ammo=MAG;me.reload=0;yaw=Math.random()*6.28;pitch=0}
function resetMatch(){scores={};over=0;if(host)for(const b of bots){const p=randSpawn();b.x=p[0];b.y=p[1];b.hp=100;b.alive=true}if(started)spawnMe()}
function onKill(d){if(!d||over>0||typeof d.k!=='string'||d.k===d.v)return;scores[d.k]=(scores[d.k]||0)+1;
 if(d.k===myId&&me.alive)me.hp=Math.min(100,me.hp+75);else{const b=host&&bots.find(x=>x.id===d.k);if(b&&b.alive)b.hp=Math.min(100,b.hp+75)}
 if(scores[d.k]>=WIN){over=4;overMsg=d.k===myId?'승리!':nameOf(d.k)+' 승리'}}
function emitKill(k,v){if(room&&hs.length)room.emit('kill',{k,v});else onKill({k,v})}
function damageMe(k){if(!active()||over>0)return;dmgFlash=.35;me.hp-=DMG;hitFx(me.x,me.y,k);
 if(me.hp<=0){me.hp=0;me.alive=false;me.respawn=3;emitKill(k,myId)}}
let parts=[];
function hitFxLocal(x,y,k){if(k===myId)marker=.2;if(parts.length>300)parts.splice(0,60);for(let i=0;i<16;i++){const a=Math.random()*6.28,s=.8+Math.random()*2.2;parts.push({x,y,z:.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:Math.random()*2.5,life:.5+Math.random()*.4,c:Math.random()<.25?'#fde047':'#d11a22'})}}
function hitFx(x,y,k){if(room&&hs.length)room.emit('dmg',{k,x:+x.toFixed(2),y:+y.toFixed(2)});else hitFxLocal(x,y,k)}
function dmgBot(o,k){hitFx(o.x,o.y,k);o.hp-=DMG;if(o.hp<=0){o.hp=0;o.alive=false;o.respawn=3;emitKill(k,o.id)}}

(async()=>{try{room=window.claude?await claude.use('room'):null}catch(e){room=null}
 if(!room)return;
 room.on('shot',m=>{const d=m.data;if(m.isMe||!d||![d.x,d.y,d.a,d.v].every(Number.isFinite))return;const e=HU.find(h=>h.id===m.peer);if(e)e.flash=.06;if(active()&&hit(d.x,d.y,d.a,d.v,me))damageMe(m.peer)});
 room.on('bhit',m=>{const d=m.data;if(d&&d.t===myId&&typeof d.k==='string')damageMe(d.k)});
 room.on('hb',m=>{const d=m.data;if(!host||!d||m.isMe)return;const b=bots[d.i];if(b&&b.alive)dmgBot(b,m.peer)});
 room.on('dmg',m=>{const d=m.data;if(d&&Number.isFinite(d.x)&&Number.isFinite(d.y)&&typeof d.k==='string')hitFxLocal(d.x,d.y,d.k)});
 room.on('kill',m=>onKill(m.data));
})();

// ---- 대기화면
nick=(()=>{try{return localStorage.getItem('nick')}catch(e){return null}})()||('플레이어'+Math.floor(100+Math.random()*900));
$('nn').textContent=nick;
function showLobby(msg){$('res').textContent=msg||'';$('lobby').style.display='flex';document.exitPointerLock&&document.exitPointerLock()}
$('play').onclick=()=>{started=true;$('lobby').style.display='none';spawnMe();try{const p=cv.requestPointerLock();p&&p.catch&&p.catch(()=>{})}catch(_){}};
function saveNick(){const v=$('ni').value.replace(/[\u0000-\u001f]/g,'').trim().slice(0,12);if(v){nick=v;$('nn').textContent=nick;try{localStorage.setItem('nick',nick)}catch(e){}}$('ni').hidden=true;$('nbtn').textContent='닉네임 설정'}
$('nbtn').onclick=()=>{if($('ni').hidden){$('ni').hidden=false;$('ni').value=nick;$('ni').focus();$('nbtn').textContent='저장'}else saveNick()};
$('ni').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')saveNick()});
(async()=>{try{const dl=window.claude?await claude.use('downloads'):null;if(!dl)return;$('dl').hidden=false;
 $('dl').onclick=async()=>{try{const c=document.documentElement.cloneNode(true);c.querySelector('#dl').remove();c.querySelector('#res').textContent='';await dl.save({filename:'deathmatch-fps.html',data:'<!DOCTYPE html>\n'+c.outerHTML})}catch(e){}}}catch(e){}})();

addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if(e.code==='KeyR'&&active()&&me.ammo<MAG&&me.reload<=0)me.reload=RELOAD});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('mousedown',e=>{if(!started)return;if(document.pointerLockElement!==cv){try{const p=cv.requestPointerLock();p&&p.catch&&p.catch(()=>{})}catch(_){}}if(e.button===0)down=true});
addEventListener('mouseup',()=>down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(document.pointerLockElement===cv&&active()){yaw+=e.movementX*.0022;pitch=Math.max(-.6,Math.min(.6,pitch-e.movementY*.0022))}});

// ---- 접속자/봇 명단 (가장 작은 peer id가 호스트: AI 봇을 시뮬레이션)
function sync(dt){
 hs=[];
 if(room){const ps=room.peers();hs=ps.filter(p=>!p.isMe&&p.kind==='viewer').sort((a,b)=>a.peer<b.peer?-1:1).slice(0,4);const mp=ps.find(p=>p.isMe&&p.sameTab);myId=mp?mp.peer:'me'}
 host=!hs.some(p=>p.peer<myId);
 const sig=myId+'|'+hs.map(p=>p.peer).join()+host;
 if(sig!==rosterSig){rosterSig=sig;
  HU=hs.map(p=>{if(!hmap.has(p.peer))hmap.set(p.peer,{id:p.peer,name:'플레이어',x:0,y:0,alive:false,flash:0,bot:false});return hmap.get(p.peer)});
  bots=Array.from({length:4-hs.length},(_,i)=>({id:'bot'+i,i,name:'AI',x:1.5,y:1.5,hp:100,alive:false,bot:true,flash:0,burst:0,rest:0,see:0,sd:1,st:0,last:0,respawn:0}));
  resetMatch();$('st').textContent=room?`접속 ${hs.length+1}명 + AI ${bots.length}명`:'오프라인 — AI 4명과 대전'}
 const k=Math.min(1,dt*20);
 hs.forEach((p,i)=>{const s=p.presence,e=HU[i];if(s.x==null){e.alive=false;return}
  if(!e.alive||Math.hypot(s.x-e.x,s.y-e.y)>3){e.x=s.x;e.y=s.y}else{e.x+=(s.x-e.x)*k;e.y+=(s.y-e.y)*k}
  e.alive=!!s.al;e.name=String(s.n||'플레이어').slice(0,12)});
 if(!host){const b=hs[0].presence.b;bots.forEach((e,i)=>{const s=Array.isArray(b)&&b[i];if(!s){e.alive=false;return}
  if(!e.alive){e.x=s[0];e.y=s[1]}else{e.x+=(s[0]-e.x)*k;e.y+=(s[1]-e.y)*k}e.alive=!!s[2]})}
 E=HU.concat(bots);
}

function botFire(b,o,a,v){if(!hit(b.x,b.y,a,v,o))return;if(o===me)damageMe(b.id);else if(!o.bot){room&&room.emit('bhit',{t:o.id,k:b.id})}else dmgBot(o,b.id)}
function botStep(b,dt,t){
 b.flash=Math.max(0,b.flash-dt);
 if(!b.alive){b.respawn-=dt;if(b.respawn<=0){const p=randSpawn();b.x=p[0];b.y=p[1];b.hp=100;b.alive=true}return}
 const T=[];if(active())T.push(me);for(const e of E)if(e!==b&&e.alive)T.push(e);
 let tv=null,dv=99,tn=null,dn=99;
 for(const o of T){const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||.01;if(d<dn){dn=d;tn=o}if(d<dv&&d<20&&cast(b.x,b.y,dx/d,dy/d).d>d){dv=d;tv=o}}
 const o=tv||tn;if(!o)return;
 const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||.01,ux=dx/d,uy=dy/d,vis=o===tv;
 b.st-=dt;if(b.st<=0){b.sd*=-1;b.st=.5+Math.random()*1.1}
 let mx=0,my=0;if(!vis||d>8){mx+=ux;my+=uy}else if(d<4.5){mx-=ux;my-=uy}
 mx+=-uy*b.sd*(vis?1:.8);my+=ux*b.sd*(vis?1:.8);
 const l=Math.hypot(mx,my)||1,ox=b.x,oy=b.y,sp=1.9*dt;moveO(b,mx/l*sp,my/l*sp);if(Math.hypot(b.x-ox,b.y-oy)<sp*.3)b.st=0;
 b.see=vis?b.see+dt:0;
 if(vis&&b.see>.3){
  if(b.rest>0)b.rest-=dt;
  else if(t-b.last>=100){
   if(b.burst<=0)b.burst=5+Math.floor(Math.random()*6);
   b.last=t;b.burst--;b.flash=.06;
   const e=.05+.005*d;botFire(b,o,Math.atan2(dy,dx)+(Math.random()*2-1)*e,(Math.random()-.55)*e*.8);
   if(b.burst<=0)b.rest=.3+Math.random()*.3;
  }
 }
}

function update(dt,t){
 marker=Math.max(0,marker-dt);dmgFlash=Math.max(0,dmgFlash-dt);shake*=Math.max(0,1-dt*10);gunKick*=Math.max(0,1-dt*12);
 for(const e of E)e.flash=Math.max(0,e.flash-dt);
 parts=parts.filter(p=>(p.life-=dt)>0);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vz-=6*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz*=-.3;p.vx*=.5;p.vy*=.5}}
 sync(dt);
 if(over>0){over-=dt;if(over<=0){over=0;const m=overMsg;started=false;down=false;showLobby(m);resetMatch()}}
 if(!started){yaw+=dt*.25}
 else if(over<=0){
  if(keys.ArrowLeft)yaw-=dt*2.2;if(keys.ArrowRight)yaw+=dt*2.2;
  if(keys.ArrowUp)pitch=Math.min(.6,pitch+dt*1.5);if(keys.ArrowDown)pitch=Math.max(-.6,pitch-dt*1.5);
  if(!me.alive){me.respawn-=dt;if(me.respawn<=0)spawnMe()}
  else{
   const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),l=Math.hypot(f,s)||1,sp=1.9*dt/l;
   moveO(me,(Math.cos(yaw)*f-Math.sin(yaw)*s)*sp,(Math.sin(yaw)*f+Math.cos(yaw)*s)*sp);
   if(me.reload>0){me.reload-=dt*1000;if(me.reload<=0)me.ammo=MAG}
   if(down&&me.reload<=0&&t-me.last>=RATE){
    me.last=t;me.ammo--;
    const ya=yaw+(Math.random()*2-1)*me.spread,va=pitch+(Math.random()*2-1)*me.spread;
    let bt=null,bb=1e9;for(const e of E)if(e.bot&&e.alive){const tt=hit(me.x,me.y,ya,va,e);if(tt&&tt<bb){bb=tt;bt=e}}
    if(bt){marker=.2;if(host)dmgBot(bt,myId);else room&&room.emit('hb',{i:bt.i})}
    if(room&&hs.length)room.emit('shot',{x:+me.x.toFixed(3),y:+me.y.toFixed(3),a:+ya.toFixed(4),v:+va.toFixed(4)});
    // 강한 소총 반동: 발당 약 0.6° 위로 튀고 좌우로 크게 흔들림, 자동 복구 없음(마우스를 내려 눌러 보정)
    pitch=Math.min(.6,pitch+.0105);yaw+=(Math.random()-.42)*.0075;me.spread=Math.min(.035,me.spread+.0018);gunKick=1;shake=Math.min(1,shake+.25);
    if(me.ammo<=0)me.reload=RELOAD;
   }
  }
  me.spread=Math.max(BASE,me.spread-dt*.03);
 }
 if(host&&over<=0)for(const b of bots)botStep(b,dt,t);
 if(room)room.presence({x:+me.x.toFixed(2),y:+me.y.toFixed(2),al:active()?1:0,n:nick,b:host?bots.map(b=>[+b.x.toFixed(2),+b.y.toFixed(2),b.alive?1:0]):null});
}

const zb=new Float32Array(W/COL);
function sprite(o){
 const dx=o.x-me.x,dy=o.y-me.y;let df=Math.atan2(dy,dx)-yaw;df=Math.atan2(Math.sin(df),Math.cos(df));
 if(Math.abs(df)>FOV)return;const dep=Math.hypot(dx,dy)*Math.cos(df);if(dep<.2)return;
 const sx=W/2+Math.tan(df)*F,pw=.5*F/dep,top=hor-.2*F/dep,bot=hor+.5*F/dep,sh=Math.max(.35,1-dep/20),c0=o.bot?[220,50,50]:[230,130,40];
 for(let c=Math.max(0,Math.floor((sx-pw/2)/COL));c<=Math.min(W/COL-1,Math.floor((sx+pw/2)/COL));c++){
  if(zb[c]<dep)continue;
  const u=Math.abs((c*COL+COL/2-sx)/(pw/2)),Hh=bot-top,rgb=(a,b,d)=>`rgb(${(a*sh)|0},${(b*sh)|0},${(d*sh)|0})`;
  if(u<.3){g.fillStyle=rgb(240,190,160);g.fillRect(c*COL,top,COL,Hh*.2)}
  if(u<.58){g.fillStyle=rgb(c0[0],c0[1],c0[2]);g.fillRect(c*COL,top+Hh*.22,COL,Hh*.38)}
  else if(u<.82){g.fillStyle=rgb(c0[0]*.7,c0[1]*.7,c0[2]*.7);g.fillRect(c*COL,top+Hh*.24,COL,Hh*.34)}
  if(u>.08&&u<.5){g.fillStyle=rgb(45,55,75);g.fillRect(c*COL,top+Hh*.6,COL,Hh*.4)}
 }
 if(o.flash>0){g.fillStyle='#fde047';g.beginPath();g.arc(sx,top+(bot-top)*.4,Math.max(3,pw*.12),0,7);g.fill()}
 const cc=Math.floor(sx/COL);
 if(cc>=0&&cc<W/COL&&zb[cc]>dep){g.font='bold 14px system-ui';g.textAlign='center';g.fillStyle='#000a';g.fillText(o.name,sx+1,top-7);g.fillStyle='#fff';g.fillText(o.name,sx,top-8)}
}
function draw(t){
 g.save();if(shake>.01)g.translate((Math.random()-.5)*shake*6,(Math.random()-.5)*shake*6);
 hor=H/2+Math.tan(pitch)*F;
 g.fillStyle='#2b3442';g.fillRect(0,0,W,Math.max(0,Math.min(H,hor)));g.fillStyle='#3a3a3f';g.fillRect(0,Math.max(0,hor),W,H);
 for(let c=0;c<W/COL;c++){
  const off=Math.atan((c*COL+COL/2-W/2)/F),r=cast(me.x,me.y,Math.cos(yaw+off),Math.sin(yaw+off)),d=r.d*Math.cos(off);zb[c]=d;
  const h=F/d,sh=Math.max(.22,1-d/16)*(r.side?.75:1),k=COLORS[r.c]||COLORS['#'];
  g.fillStyle=`rgb(${(k[0]*sh)|0},${(k[1]*sh)|0},${(k[2]*sh)|0})`;g.fillRect(c*COL,hor-.5*h,COL,h);
 }
 E.filter(e=>e.alive).sort((a,b)=>Math.hypot(b.x-me.x,b.y-me.y)-Math.hypot(a.x-me.x,a.y-me.y)).forEach(sprite);
 for(const p of parts){const dx=p.x-me.x,dy=p.y-me.y,fw=dx*Math.cos(yaw)+dy*Math.sin(yaw);if(fw<.15)continue;const sx=W/2+(-dx*Math.sin(yaw)+dy*Math.cos(yaw))/fw*F,sy=hor+(.5-p.z)/fw*F,c=Math.floor(sx/COL);if(c<0||c>=W/COL||zb[c]<fw)continue;g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.c;const s=Math.max(2,.045*F/fw);g.fillRect(sx-s/2,sy-s/2,s,s)}
 g.globalAlpha=1;
 g.restore();
 if(started){
  const gx=W*.6,gy=H-190+gunKick*30;
  g.fillStyle='#15161a';g.beginPath();g.moveTo(gx+10,gy+70);g.lineTo(gx+95,gy+70);g.lineTo(gx+22,gy-125);g.lineTo(gx+8,gy-125);g.closePath();g.fill();
  g.fillStyle='#24262c';g.fillRect(gx+4,gy+60,120,140);g.fillStyle='#1b1c20';g.fillRect(gx+120,gy+90,100,110);
  g.fillStyle='#0d0d10';g.save();g.translate(gx+40,gy+170);g.rotate(.12);g.fillRect(0,0,26,70);g.restore();
  g.fillStyle='#3a3d45';g.fillRect(gx+4,gy-134,18,10);
  if(t-me.last<45&&me.alive){g.fillStyle='#fde047';g.beginPath();g.arc(gx+15,gy-136,18,0,7);g.fill()}
 }
 if(dmgFlash>0){g.fillStyle=`rgba(255,0,0,${dmgFlash*.9})`;g.fillRect(0,0,W,H)}
 if(started){
  const gap=4+me.spread*F;g.strokeStyle=marker>0?'#f87171':'#fff';g.lineWidth=2;g.beginPath();
  g.moveTo(W/2-gap-8,H/2);g.lineTo(W/2-gap,H/2);g.moveTo(W/2+gap,H/2);g.lineTo(W/2+gap+8,H/2);g.moveTo(W/2,H/2-gap-8);g.lineTo(W/2,H/2-gap);g.moveTo(W/2,H/2+gap);g.lineTo(W/2,H/2+gap+8);g.stroke();
  {const S=4,ox=10,oy=10;g.fillStyle='#000a';g.fillRect(ox-2,oy-2,MW*S+4,MH*S+4);
   for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(M[y][x]!=='.'){const k=COLORS[M[y][x]]||COLORS['#'];g.fillStyle=`rgb(${k[0]},${k[1]},${k[2]})`;g.fillRect(ox+x*S,oy+y*S,S,S)}}
   const px=ox+me.x*S,py=oy+me.y*S;g.strokeStyle='#fde047';g.lineWidth=1.5;g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(yaw)*9,py+Math.sin(yaw)*9);g.stroke();
   g.fillStyle='#fde047';g.beginPath();g.arc(px,py,3,0,7);g.fill()}
  g.fillStyle='#0009';g.fillRect(16,H-36,220,14);g.fillStyle=me.hp>40?'#4ade80':'#f87171';g.fillRect(16,H-36,220*me.hp/100,14);
  g.font='bold 18px system-ui';g.fillStyle='#fff';g.textAlign='left';g.fillText(me.reload>0?'재장전 중…':me.ammo+' / ∞',16,H-46);
  if(me.reload>0){g.fillStyle='#fff3';g.fillRect(16,H-18,120,4);g.fillStyle='#fff';g.fillRect(16,H-18,120*(1-me.reload/RELOAD),4)}
  const rows=[[nick,scores[myId]||0,1]].concat(E.map(e=>[e.name,scores[e.id]||0,0])).sort((a,b)=>b[1]-a[1]);
  g.font='bold 15px system-ui';g.textAlign='right';g.fillStyle='#fffc';g.fillText('먼저 '+WIN+'킬',W-16,24);
  rows.forEach((r,i)=>{g.fillStyle=r[2]?'#fde047':'#fff';g.fillText(r[0]+'  '+r[1],W-16,46+i*20)});
  g.textAlign='center';g.font='bold 34px system-ui';g.fillStyle='#fff';
  if(over>0)g.fillText(overMsg,W/2,H/2-70);
  else if(!me.alive){g.font='bold 26px system-ui';g.fillText('리스폰 '+Math.ceil(me.respawn)+'…',W/2,H/2-70)}
 }
}
let prev=performance.now();
(function loop(t){const dt=Math.min(.05,(t-prev)/1000);prev=t;update(dt,t);draw(t);requestAnimationFrame(loop)})(prev);
</script>
